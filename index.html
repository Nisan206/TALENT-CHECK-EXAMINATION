<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result Check - Examination Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti for Celebration Animation -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Joyful keyframe animations */
    @keyframes popIn {
      0% {
        transform: scale(0.6) rotate(-4deg);
        opacity: 0;
      }
      60% {
        transform: scale(1.08) rotate(2deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.4), 0 0 45px rgba(245, 158, 11, 0.25);
      }
      50% {
        box-shadow: 0 0 32px rgba(16, 185, 129, 0.7), 0 0 65px rgba(245, 158, 11, 0.45);
      }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes cheerFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.05); }
    }

    .animate-pop-in {
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .animate-pulse-glow {
      animation: pulseGlow 2s infinite ease-in-out;
    }

    .animate-wiggle {
      animation: wiggle 0.8s ease-in-out infinite;
    }

    .animate-cheer {
      animation: cheerFloat 1.8s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Main Container -->
  <div class="flex-grow flex flex-col items-center justify-start py-10 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-4xl space-y-8">
      
      <!-- Header Section -->
      <header class="text-center space-y-3">
        <div class="inline-flex items-center justify-center p-3 bg-indigo-50 text-indigo-600 rounded-2xl shadow-sm mb-1">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Result Check</h1>
        
        <!-- Organizer Badge -->
        <div class="inline-block">
          <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">
            <svg class="w-3.5 h-3.5 text-indigo-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
            </svg>
            Organised By : Himabrata Sarkar
          </span>
        </div>

        <!-- Distinct Instructions Callout Box -->
        <div class="pt-2">
          <div class="max-w-md mx-auto bg-white/80 backdrop-blur-xs border border-indigo-100 rounded-2xl p-3.5 shadow-sm flex items-center gap-3 text-left">
            <div class="p-2 bg-indigo-50 rounded-xl text-indigo-600 shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
            <p class="text-xs text-slate-600 font-medium leading-relaxed">
              <strong class="text-slate-800 font-semibold block text-xs">Student Examination Results Portal</strong>
              Click on any student's name below to view their detailed performance report.
            </p>
          </div>
        </div>
      </header>

      <!-- Student Selection Grid -->
      <section class="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-6 sm:p-8">
        <div id="student-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Student cards generated by JavaScript -->
        </div>
      </section>

    </div>
  </div>

  <!-- Detailed Modal Popup -->
  <div id="resultModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden transition-opacity duration-200" role="dialog" aria-modal="true" aria-labelledby="modalStudentName">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden transform transition-all scale-95 opacity-0 duration-200 border border-slate-100" id="modalContainer">
      
      <!-- Modal Top Bar -->
      <div id="modalHeader" class="relative bg-slate-900 px-6 py-5 text-white text-center transition-colors duration-300">
        <button id="closeModalBtn" class="absolute top-4 right-4 p-2 rounded-full text-white/70 hover:text-white hover:bg-black/20 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
        <span class="text-xs uppercase tracking-widest text-white/80 font-bold">Result Card</span>
      </div>

      <!-- Modal Content Body -->
      <div class="p-6 sm:p-8 space-y-6 text-center">
        
        <!-- Student Name Display (Shifted higher, label removed) -->
        <div class="-mt-2 mb-2">
          <h2 id="modalStudentName" class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight leading-tight">Student Name</h2>
        </div>

        <!-- Prominent Circular Score Badge -->
        <div class="flex flex-col items-center justify-center pt-1">
          <div id="scoreCircle" class="relative w-40 h-40 rounded-full bg-linear-to-b from-slate-50 to-indigo-50/60 border-4 border-indigo-500/20 shadow-inner flex flex-col items-center justify-center p-3 transition-all duration-300">
            <!-- Obtained Marks -->
            <span id="modalObtainedMarksCircle" class="text-4xl font-extrabold text-slate-900 tracking-tight leading-tight">0</span>
            <!-- Divider line -->
            <div class="w-20 h-0.5 bg-slate-300 my-1 rounded-full"></div>
            <!-- Total Marks -->
            <span class="text-4xl font-extrabold text-slate-900 tracking-tight leading-tight">50</span>
          </div>
        </div>

        <!-- Pass / Fail Badge Center -->
        <div class="flex flex-col items-center justify-center">
          <div id="statusBadge" class="inline-flex items-center justify-center px-8 py-3 rounded-full font-black text-2xl tracking-wider shadow-md transition-all duration-300">
            <!-- Dynamic Status Badge -->
          </div>
        </div>

        <!-- Action Button -->
        <button id="modalDoneBtn" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-semibold shadow-md transition duration-150 active:scale-98">
          Close Scorecard
        </button>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-6 text-center text-xs text-slate-400">
    <p>&copy; Result Check Portal. All rights reserved.</p>
  </footer>

  <!-- Script Section -->
  <script>
    const totalMarks = 50;
    const passingMarks = 5;

    const students = [
      { id: 1, name: "Aditya Barman", marks: 13 },
      { id: 2, name: "Anushka Sarkar", marks: 21 },
      { id: 3, name: "Gitanjali Barman", marks: 27 },
      { id: 4, name: "Himadri Barman", marks: 17 },
      { id: 5, name: "Ishan Sarkar", marks: 29 },
      { id: 6, name: "Mouli Biswas", marks: 23 },
      { id: 7, name: "Rajdeep Sarkar", marks: 36 }
    ];

    const studentGrid = document.getElementById("student-grid");
    const resultModal = document.getElementById("resultModal");
    const modalContainer = document.getElementById("modalContainer");
    const modalHeader = document.getElementById("modalHeader");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const modalDoneBtn = document.getElementById("modalDoneBtn");

    const modalStudentName = document.getElementById("modalStudentName");
    const scoreCircle = document.getElementById("scoreCircle");
    const modalObtainedMarksCircle = document.getElementById("modalObtainedMarksCircle");
    const statusBadge = document.getElementById("statusBadge");

    // Celebration Confetti Cannon
    function triggerCelebrationConfetti() {
      // First immediate burst
      confetti({
        particleCount: 70,
        spread: 60,
        origin: { y: 0.65 },
        colors: ['#10B981', '#34D399', '#3B82F6', '#6366F1', '#14B8A6']
      });

      // Left cannon
      setTimeout(() => {
        confetti({
          particleCount: 45,
          angle: 60,
          spread: 55,
          origin: { x: 0.15, y: 0.7 },
          colors: ['#10B981', '#34D399', '#6366F1']
        });
      }, 180);

      // Right cannon
      setTimeout(() => {
        confetti({
          particleCount: 45,
          angle: 120,
          spread: 55,
          origin: { x: 0.85, y: 0.7 },
          colors: ['#10B981', '#3B82F6', '#14B8A6']
        });
      }, 360);
    }

    // Render Student List Cards
    function renderStudents() {
      studentGrid.innerHTML = "";
      students.forEach((student) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "group text-left p-5 bg-white border border-slate-200 rounded-2xl hover:border-indigo-400 hover:shadow-lg transition-all duration-200 flex items-center justify-between focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 active:scale-98";
        
        card.innerHTML = `
          <div class="flex items-center space-x-3.5">
            <div class="w-11 h-11 rounded-xl bg-indigo-50 text-indigo-700 font-bold flex items-center justify-center text-base group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-200 shadow-xs">
              ${student.name.charAt(0)}
            </div>
            <div>
              <h3 class="font-bold text-slate-800 group-hover:text-indigo-600 transition-colors text-base leading-snug">
                ${student.name}
              </h3>
              <p class="text-xs text-slate-400 mt-0.5">Click to view scorecard</p>
            </div>
          </div>
          <div class="text-slate-300 group-hover:text-indigo-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </div>
        `;

        card.addEventListener("click", () => openStudentModal(student));
        studentGrid.appendChild(card);
      });
    }

    // Open Modal
    function openStudentModal(student) {
      const isPassed = student.marks >= passingMarks;

      modalStudentName.textContent = student.name;
      modalObtainedMarksCircle.textContent = student.marks;

      // Reset prior animations
      modalContainer.classList.remove("animate-pop-in");
      scoreCircle.classList.remove("animate-pulse-glow", "border-emerald-500/40", "bg-emerald-50/40", "border-rose-500/30", "bg-rose-50/30");

      if (isPassed) {
        // Passed Header & Glowing circle
        modalHeader.className = "relative bg-linear-to-r from-emerald-600 to-teal-700 px-6 py-6 text-white text-center transition-colors duration-300";
        scoreCircle.classList.add("animate-pulse-glow", "border-emerald-500/40", "bg-emerald-50/40");

        // Clean Green PASS Badge
        statusBadge.className = "inline-flex items-center justify-center px-10 py-3 rounded-full font-black text-2xl tracking-widest bg-emerald-500 text-white shadow-lg shadow-emerald-500/30 border border-emerald-400";
        statusBadge.textContent = "PASS";

        // Confetti effect
        setTimeout(() => {
          triggerCelebrationConfetti();
        }, 150);

      } else {
        // Fail Header & Styling
        modalHeader.className = "relative bg-slate-900 px-6 py-6 text-white text-center transition-colors duration-300";
        scoreCircle.classList.add("border-rose-500/30", "bg-rose-50/30");

        // Clean Red FAIL Badge
        statusBadge.className = "inline-flex items-center justify-center px-10 py-3 rounded-full font-black text-2xl tracking-widest bg-rose-600 text-white shadow-lg shadow-rose-600/30 border border-rose-500";
        statusBadge.textContent = "FAIL";
      }

      // Show modal with bounce
      resultModal.classList.remove("hidden");
      setTimeout(() => {
        modalContainer.classList.remove("scale-95", "opacity-0");
        modalContainer.classList.add("animate-pop-in");
      }, 10);
    }

    // Close Modal
    function closeModal() {
      modalContainer.classList.remove("animate-pop-in");
      modalContainer.classList.add("scale-95", "opacity-0");
      setTimeout(() => {
        resultModal.classList.add("hidden");
      }, 150);
    }

    closeModalBtn.addEventListener("click", closeModal);
    modalDoneBtn.addEventListener("click", closeModal);

    // Close on backdrop click
    resultModal.addEventListener("click", (e) => {
      if (e.target === resultModal) {
        closeModal();
      }
    });

    // Close on Escape key
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !resultModal.classList.contains("hidden")) {
        closeModal();
      }
    });

    // Initial render on load
    window.onload = function() {
      renderStudents();
    };
  </script>
</body>
</html>
```
